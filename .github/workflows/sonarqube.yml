# No destination is configured. This required status fails closed before any upload.
name: SonarQube quality gate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonar-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Require an approved SonarQube destination
        shell: pwsh
        run: ./scripts/Run-SonarAnalysis.ps1 -ValidateConfigurationOnly
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: SQLineage/sql-grammar-plsql
          ref: e92154a458bad34eced2134396deff19e4da25e5
          path: artifacts/dependencies/grammar
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build packages and test independent consumers
        shell: pwsh
        run: ./scripts/Validate.ps1 -GrammarPath ./artifacts/dependencies/grammar
      - name: Analyze, wait for processing, and enforce SonarQube gate
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./scripts/Run-SonarAnalysis.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonar-test-results
          path: TestResults/sonar/
          if-no-files-found: warn
