# Analysis artifacts only: no security-events write permission, database upload, or publishing.
name: Security analysis
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, actions]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'csharp' && 'manual' || 'none' }}
      - uses: actions/checkout@v4
        with:
          repository: SQLineage/sql-grammar-plsql
          ref: e92154a458bad34eced2134396deff19e4da25e5
          path: artifacts/dependencies/grammar
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build packages and test independent consumers
        shell: pwsh
        run: ./scripts/Validate.ps1 -GrammarPath ./artifacts/dependencies/grammar
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
          upload: never
          upload-database: false
          output: artifacts/codeql
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-${{ matrix.language }}
          path: artifacts/codeql/*.sarif
          if-no-files-found: error