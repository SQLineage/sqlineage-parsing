name: Parser package consumers
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SQLineage/sql-grammar-plsql
          ref: 5ce456d50e22d4ce23f92e37db43790f33001d3d
          path: artifacts/dependencies/grammar
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build packages and test independent consumers
        shell: pwsh
        run: ./scripts/Validate.ps1 -GrammarPath ./artifacts/dependencies/grammar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parser-test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore
